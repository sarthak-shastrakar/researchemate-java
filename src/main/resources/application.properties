server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/researchemate_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


researchmate.ai.openrouter-key=${OPENROUTER_API_KEY}
researchmate.ai.openrouter-url=https://openrouter.ai/api/v1/chat/completions
researchmate.ai.openrouter-model=openai/gpt-3.5-turbo

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
researchmate.storage.image-upload-dir=./uploads/images

researchmate.jwt.secret=${JWT_SECRET}
researchmate.jwt.access-token-expiry-ms=${JWT_EXPIRATION_MS}
researchmate.jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRATION_MS}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}